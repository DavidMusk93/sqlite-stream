[package]
name = "sqlite-stream"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Schema-aware SQLite backup and restore streams"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.41.1", features = ["bundled", "limits", "hooks", "extra_check"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zstd = "0.13"
tempfile = "3"

[dev-dependencies]

[profile.release]
lto = "thin"
strip = true
